modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/pharuxtan/woot"
license = "LGPLv3"

[[mods]]
modId = "${file.modId}"
version = "${file.jarVersion}"
displayName = "Woot Revived"
displayURL = "https://github.com/pharuxtan/woot"
logoFile = "woot_revived.png"
authors = "pharuxtan"
credits = "Ipsis"
description = '''A formidable multiblock mod to harvest mob drops. You'll either fall in love or despise it! No middle ground.'''

[[mixins]]
config = "woot_revived.mixins.json"

[[dependencies.${file.modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${mc_version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${file.modId}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${file.modId}]]
modId="guideme"
type = "required"
versionRange = "[${guideme_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${file.modId}]]
modId="jei"
type = "optional"
versionRange = "[${jei_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${file.modId}]]
modId="jade"
type = "optional"
versionRange = "[${jade_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${file.modId}]]
modId="kubejs"
type = "optional"
versionRange = "[${kubejs_version},)"
ordering="NONE"
side="BOTH"
